name = "cd4vt"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Gluck", "ForMathlib", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Gluck"

[[lean_lib]]
name = "ForMathlib"

# The trusted statement (Mathlib imports only) and the solution root that
# `lake comparator` judges against it; see comparator.json.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
