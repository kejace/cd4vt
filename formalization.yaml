automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 4.8", "Claude Fable 5", "Claude Opus 5.5"]
      framework: "Claude Code, Archon"
      tool_setup: >-
        Agents wrote Lean proofs directly against the Lean compiler and a Lean
        language-server MCP, orchestrated in an Archon prover loop.
    - method: "autonomous"
      models: ["Aristotle"]
      framework: "Aristotle (Harmonic)"
      tool_setup: "Individual lemmas submitted as Lean projects; results compiled and checked locally."
    - method: "other"
      models: ["Codex", "DeepSeek"]
      notes: "Discussion and cross-checking, as acknowledged in the paper."
  notes: >-
    The mathematics and proofs were developed with AI assistance (Aristotle,
    Claude, Codex, DeepSeek); the author takes full responsibility for their
    correctness. Lean statements were reviewed against the paper, and the
    Comparator check in comparator/ ties them to a hand-written challenge.

fidelity:
  divergences: >-
    Polygons are maps ZMod n -> C. "Coherent convex polygon" is
    IsCoherentConvexPolygon (simplicity, strict convexity, coherence);
    radii are vertexCircumradius. Theorem 7.2 is stated for counterclockwise
    simple Dahlberg-regular hexagons with prescribed signed Menger curvature;
    the paper explains why this implies the stated theorem. In Theorem 7.1 the
    hypotheses n >= 4 and nonconstancy are implied by the DFV hypothesis and
    are not separate assumptions.

review:
  status: "self-assessed"
  reviewers: ["Kristoffer Josefsson"]
  notes: >-
    The six main statements and the 37 definitions they depend on are restated
    independently in comparator/Challenge.lean and comparator/Challenge/
    (Mathlib imports only); Comparator (leanprover/comparator) confirms that
    the library proves exactly these statements using only the permitted
    axioms, and the kernel replays the proofs. CI checks the axioms with
    scripts/axioms.lean.

