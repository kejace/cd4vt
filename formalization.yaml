version: "v0.4"

project:
  name: "A converse to the discrete four-vertex theorem"
  description: >-
    Lean 4 / Mathlib formalization of the paper "A converse to the discrete
    four-vertex theorem", answering Tabachnikov's Problem 2. For every n >= 4,
    every cyclic sequence of positive numbers with two distinct plateau maxima
    and two distinct plateau minima is the sequence of circumradii of
    consecutive vertex triples of a simple, strictly convex, coherent polygon
    (circumcenters inside the vertex angles). Together with Dahlberg's discrete
    four-vertex theorem, also proved here, this characterizes the nonconstant
    radius sequences of such polygons. The realization can be chosen C^1 in
    the data near every nonconstant admissible sequence, but an explicit path
    of hexagon data admits no continuous choice of realizing polygons. The
    analogous characterization for circles tangent to three consecutive
    supporting lines (the converse to Wegner's four-edge theorem) is also
    proved.
  authors: ["Kristoffer Josefsson"]
  responsible_maintainers: ["Kristoffer Josefsson"]
  license: "Apache-2.0"

sources:
  - title: "A converse to the discrete four-vertex theorem"
    authors: ["Kristoffer Josefsson"]
    id: "paper/tabachnikov-converse.tex (this repository)"
    type: "original-proof"
    location: "Theorems 1.1, 7.1, 7.2, 8.2; Corollaries 1.2, 8.6"
    relationship: "formalizes"
    note: >-
      The paper and the formalization were developed together; the Lean
      appendix of the paper displays the formal statements.
    license: ""
    author_endorsement: "participated"
  - title: "Converse Sturm-Hurwitz-Kellogg theorem and related results"
    authors: ["Serge Tabachnikov"]
    id: "doi:10.1007/s11784-007-0049-y; arXiv:0710.5902"
    type: "article"
    location: "Problem 2"
    relationship: "other"
    note: >-
      Poses the open problem that this project solves; Problem 2 is stated in
      Lean as Gluck.Discrete.tabachnikovProblem2_all.
    author_endorsement: "not-contacted"
  - title: "A discrete four vertex theorem"
    authors: ["Björn E. J. Dahlberg"]
    id: "doi:10.1007/s10711-008-9238-0"
    type: "article"
    relationship: "independently-proves"
    note: >-
      The forward theorem, giving necessity in Corollary 1.2; its plateau
      convention for counting extrema is used throughout. Proved in Lean, not
      assumed.
    author_endorsement: "n/a"
  - title: "On the evolutes of piecewise linear curves in the plane"
    authors: ["Bernd Wegner"]
    id: "Rad Hrvatske Akad. Znan. Umjet. Mat. Znan. 11 (1994), 1-16"
    type: "article"
    location: "Theorem 1"
    relationship: "independently-proves"
    note: >-
      Wegner's four-edge theorem, the forward direction of Corollary 8.6.
      Proved in Lean (Gluck.Discrete.SideTangent.sideTangentForward), not
      assumed.
    author_endorsement: "not-contacted"

